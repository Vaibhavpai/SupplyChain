[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-inventory-rebalancer"
version = "1.0.0"
description = "Deterministic warehouse inventory rebalancing environment for benchmarking LLM planning and operations research reasoning."
authors = [
  { name="Vaibhav Pai" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:run"
